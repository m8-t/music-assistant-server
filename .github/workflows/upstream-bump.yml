name: Bump Upstream Base Version

on:
  schedule:
    - cron: "0 2 * * *"  # Daily at 2 AM UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  packages: read

jobs:
  check-and-bump:
    name: Check for upstream updates and bump if newer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: feat/wiim-remote-transport

      - name: Fetch upstream releases
        id: upstream
        run: |
          # Fetch all releases from upstream and filter to stable versions only
          # Stable versions match X.Y.Z pattern (no b, rc, or dev suffixes)
          LATEST_STABLE=$(gh release list \
            --repo music-assistant/server \
            --limit 100 \
            --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease == false) | .tagName' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -1)

          if [ -z "$LATEST_STABLE" ]; then
            echo "ERROR: Could not determine latest stable upstream version"
            exit 1
          fi

          echo "Latest stable upstream version: $LATEST_STABLE"
          echo "latest_version=${LATEST_STABLE}" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine current base version
        id: current
        run: |
          CURRENT=$(grep "^ARG BASE_VERSION=" docker/wiim-derived.Dockerfile | sed 's/.*=//; s/"//g')
          echo "Current base version: $CURRENT"
          echo "current_version=${CURRENT}" >> $GITHUB_OUTPUT

      - name: Authenticate to container registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Compare versions and update if needed
        id: compare
        env:
          CURRENT: ${{ steps.current.outputs.current_version }}
          LATEST: ${{ steps.upstream.outputs.latest_version }}
        run: |
          # Compare versions: newer iff LATEST is sorted last and differs from CURRENT
          newest=$(printf '%s\n' "$CURRENT" "$LATEST" | sort -V | tail -1)

          needs_update=false
          if [ "$newest" = "$LATEST" ] && [ "$CURRENT" != "$LATEST" ]; then
            echo "Newer version available: $CURRENT → $LATEST"
            needs_update=true
            echo "new_version=${LATEST}" >> $GITHUB_OUTPUT
          else
            echo "Already on latest stable version ($CURRENT)"
          fi
          echo "needs_update=${needs_update}" >> $GITHUB_OUTPUT

          # Check if derived image exists for the latest version
          image_exists=true
          if ! docker manifest inspect "ghcr.io/${{ github.repository_owner }}/music-assistant-server:${LATEST}-wiim-remote" >/dev/null 2>&1; then
            image_exists=false
          fi

          # Determine if a build is needed: either a version bump OR missing image
          if [ "$needs_update" = "true" ] || [ "$image_exists" = "false" ]; then
            echo "needs_build=true" >> $GITHUB_OUTPUT
            if [ "$needs_update" = "true" ]; then
              echo "Decision: bumping to ${LATEST}"
            else
              echo "Decision: self-healing missing derived image for ${LATEST}"
            fi
          else
            echo "needs_build=false" >> $GITHUB_OUTPUT
            echo "Decision: idle (already on latest, image exists)"
          fi

      - name: Update version references
        if: steps.compare.outputs.needs_update == 'true'
        env:
          NEW_VERSION: ${{ steps.compare.outputs.new_version }}
        run: |
          # Update Dockerfile (single source of truth for BASE_VERSION)
          sed -i "s/^ARG BASE_VERSION=.*/ARG BASE_VERSION=${NEW_VERSION}/" \
            docker/wiim-derived.Dockerfile

          echo "Updated Dockerfile to base version ${NEW_VERSION}"

      - name: Commit and push bump
        if: steps.compare.outputs.needs_update == 'true'
        env:
          NEW_VERSION: ${{ steps.compare.outputs.new_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docker/wiim-derived.Dockerfile

          git commit -m "chore: bump upstream base to ${NEW_VERSION}"

          git push origin HEAD:feat/wiim-remote-transport

          echo "Pushed version bump commit"

      - name: Trigger derived image build
        if: steps.compare.outputs.needs_update == 'true'
        env:
          NEW_VERSION: ${{ steps.compare.outputs.new_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run wiim-derived-image.yml \
            --repo ${{ github.repository }} \
            --ref feat/wiim-remote-transport \
            -f base_version="${NEW_VERSION}"

          echo "Triggered build workflow for version ${NEW_VERSION}"

      - name: Retry derived image build for missing image
        if: steps.compare.outputs.needs_update == 'false' && steps.compare.outputs.needs_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run wiim-derived-image.yml \
            --repo ${{ github.repository }} \
            --ref feat/wiim-remote-transport

          echo "Retriggered build workflow: Dockerfile already pins the version but derived image is missing"
