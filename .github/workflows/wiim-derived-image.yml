name: Build WiiM Derived Image

on:
  workflow_dispatch:
    inputs:
      base_version:
        description: "Base Music Assistant Server version (e.g., 2.9.13)"
        required: false
        default: "2.9.13"
        type: string
      tag_suffix:
        description: "Tag suffix for the derived image (e.g., wiim-remote)"
        required: false
        default: "wiim-remote"
        type: string
  push:
    branches:
      - feat/wiim-remote-transport
    paths:
      - "music_assistant/providers/wiim/**"
      - "docker/wiim-derived.Dockerfile"
      - ".github/workflows/wiim-derived-image.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push WiiM derived image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch upstream tags
        run: git fetch --tags https://github.com/music-assistant/server.git

      - name: Derive patch from commits
        id: patch
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BASE_VERSION: ${{ inputs.base_version }}
        run: |
          # Determine BASE_VERSION (same logic as Determine build inputs step)
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            BASE_VERSION="$INPUT_BASE_VERSION"
          else
            BASE_VERSION="2.9.13"
          fi

          # Extract BRANCH_BASE from Dockerfile (the tag our commits are rebased onto)
          BRANCH_BASE=$(grep "^ARG BRANCH_BASE=" docker/wiim-derived.Dockerfile | sed 's/.*=//; s/"//g')
          echo "Branch base tag: $BRANCH_BASE"

          # Verify both tags exist
          if ! git rev-parse "refs/tags/${BASE_VERSION}" >/dev/null 2>&1; then
            echo "ERROR: Base version tag ${BASE_VERSION} not found in repository"
            git tag -l | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -5
            exit 1
          fi
          if ! git rev-parse "refs/tags/${BRANCH_BASE}" >/dev/null 2>&1; then
            echo "ERROR: Branch base tag ${BRANCH_BASE} not found in repository"
            exit 1
          fi

          # CRITICAL GUARD: Verify that BRANCH_BASE is an ancestor of HEAD
          # If this check fails, the branch is not based on BRANCH_BASE and the patch would
          # contain upstream changes (or their reverse), silently breaking the build
          if ! git merge-base --is-ancestor "refs/tags/${BRANCH_BASE}" HEAD; then
            echo "ERROR: refs/tags/${BRANCH_BASE} is not an ancestor of HEAD."
            echo "The branch must be rebased directly onto the BRANCH_BASE tag, otherwise the"
            echo "derived patch would contain upstream changes (or their reverse) instead of ours."
            echo "HEAD:          $(git rev-parse HEAD)"
            echo "BRANCH_BASE:   $(git rev-parse "refs/tags/${BRANCH_BASE}")"
            echo "merge-base:    $(git merge-base HEAD "refs/tags/${BRANCH_BASE}")"
            exit 1
          fi

          # Derive patch from BRANCH_BASE to HEAD (independent of which image version we build)
          echo "Deriving patch from refs/tags/${BRANCH_BASE} to HEAD"
          git diff "refs/tags/${BRANCH_BASE}" HEAD -- music_assistant/ > overlay.patch

          # Verify patch is not empty
          if [ ! -s overlay.patch ]; then
            echo "ERROR: Generated patch is empty - no changes relative to branch base ${BRANCH_BASE}"
            exit 1
          fi

          # Sanity guard: fail if patch includes too many commits (would indicate wrong BRANCH_BASE)
          commit_count=$(git rev-list --count "refs/tags/${BRANCH_BASE}..HEAD")
          if [ "$commit_count" -gt 10 ]; then
            echo "ERROR: Too many commits ($commit_count > 10) between BRANCH_BASE and HEAD"
            echo "This suggests BRANCH_BASE is misconfigured. Expected 2-3 feature commits."
            exit 1
          fi
          echo "Patch spans $commit_count commit(s)"

          # CRITICAL GUARD: Verify that patch only touches the expected files
          # An unexpected file in the patch is exactly the symptom of upstream changes
          # being included (or reversed) in the patch.
          # This list must be extended if the feature grows to touch additional files.
          ALLOWED_FILES="music_assistant/models/player.py music_assistant/controllers/streams/controller.py music_assistant/providers/wiim/player.py"

          echo ""
          echo "=== Files touched by patch ==="
          PATCHED_FILES=$(grep '^+++ b/' overlay.patch | sed 's#^+++ b/##')
          if [ -z "$PATCHED_FILES" ]; then
            echo "(none)"
          else
            echo "$PATCHED_FILES"
          fi
          echo "=== End files list ==="
          echo ""

          # Check that all patched files are in the allowlist
          while IFS= read -r file; do
            if [ -z "$file" ]; then
              continue
            fi
            case " $ALLOWED_FILES " in
              *" $file "*)
                ;;
              *)
                echo "ERROR: Patch contains unexpected file: $file"
                echo "Allowed files:"
                printf '  %s\n' $ALLOWED_FILES
                exit 1
                ;;
            esac
          done <<< "$PATCHED_FILES"

          patch_size=$(wc -l < overlay.patch)
          echo "Patch generated: $patch_size lines"
          echo "patch_file=overlay.patch" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine build inputs
        id: build_inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BASE_VERSION: ${{ inputs.base_version }}
          INPUT_TAG_SUFFIX: ${{ inputs.tag_suffix }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # Use workflow_dispatch inputs if provided, otherwise use defaults from push
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            BASE_VERSION="$INPUT_BASE_VERSION"
            TAG_SUFFIX="$INPUT_TAG_SUFFIX"
          else
            BASE_VERSION="2.9.13"
            TAG_SUFFIX="wiim-remote"
          fi

          echo "base_version=${BASE_VERSION}" >> $GITHUB_OUTPUT
          echo "tag_suffix=${TAG_SUFFIX}" >> $GITHUB_OUTPUT
          echo "run_number=${RUN_NUMBER}" >> $GITHUB_OUTPUT

      - name: Generate Docker tags
        id: tags
        env:
          BASE_VERSION: ${{ steps.build_inputs.outputs.base_version }}
          TAG_SUFFIX: ${{ steps.build_inputs.outputs.tag_suffix }}
          RUN_NUMBER: ${{ steps.build_inputs.outputs.run_number }}
        run: |
          REGISTRY="ghcr.io/${{ github.repository_owner }}"
          IMAGE_NAME="music-assistant-server"

          # Construct tags
          VERSIONED_TAG="${REGISTRY}/${IMAGE_NAME}:${BASE_VERSION}-${TAG_SUFFIX}.${RUN_NUMBER}"
          MOVING_TAG="${REGISTRY}/${IMAGE_NAME}:${BASE_VERSION}-${TAG_SUFFIX}"

          TAGS="${VERSIONED_TAG},${MOVING_TAG}"

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "versioned_tag=${VERSIONED_TAG}" >> $GITHUB_OUTPUT
          echo "moving_tag=${MOVING_TAG}" >> $GITHUB_OUTPUT

          echo "📦 Image tags:"
          echo "  Versioned: ${VERSIONED_TAG}"
          echo "  Moving:    ${MOVING_TAG}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: docker/wiim-derived.Dockerfile
          platforms: linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          push: true
          build-args: |
            BASE_VERSION=${{ steps.build_inputs.outputs.base_version }}

      - name: Output image reference to job summary
        env:
          VERSIONED_TAG: ${{ steps.tags.outputs.versioned_tag }}
          MOVING_TAG: ${{ steps.tags.outputs.moving_tag }}
        run: |
          {
            echo "## WiiM Derived Image Built Successfully"
            echo ""
            echo "### Image References"
            echo ""
            echo "**Versioned tag** (includes run number):"
            echo "\`\`\`"
            echo "${VERSIONED_TAG}"
            echo "\`\`\`"
            echo ""
            echo "**Moving tag** (latest build with this base version):"
            echo "\`\`\`"
            echo "${MOVING_TAG}"
            echo "\`\`\`"
            echo ""
            echo "### Usage in GitOps"
            echo ""
            echo "Pin to a specific build:"
            echo "\`\`\`yaml"
            echo "image: ${VERSIONED_TAG}"
            echo "\`\`\`"
            echo ""
            echo "Or use the latest from this base version:"
            echo "\`\`\`yaml"
            echo "image: ${MOVING_TAG}"
            echo "\`\`\`"
          } >> $GITHUB_STEP_SUMMARY
